name: 'ecommerce_dbt'
version: '1.0.0'
config-version: 2

# Chỉ định tên profile trong file profiles.yml
profile: 'ecommerce_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Cấu hình Materialization theo chuẩn Kimball
models:
  ecommerce_dbt:
    # Tầng Staging: Materialized dưới dạng VIEW (nhẹ, nhanh, không tốn dung lượng lưu trữ)
    staging:
      +materialized: view
      +schema: staging

    # Tầng Marts: Materialized dưới dạng TABLE (tối ưu tốc độ query cho Analyst và Dashboard)
    marts:
      +materialized: table
      +schema: marts
