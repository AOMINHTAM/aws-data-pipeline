version: 2

models:
  - name: fct_orders
    description: "Bảng Fact chính lưu trữ toàn bộ đơn hàng kèm các chỉ số doanh thu, vận chuyển và đánh giá"
    columns:
      - name: order_id
        description: "Khóa chính (Primary Key) của đơn hàng"
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: "Khóa ngoại liên kết với bảng dim_customers"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_status
        description: "Trạng thái hiện tại của đơn hàng"
        data_tests:
          - not_null
      - name: order_purchase_timestamp
        description: "Thời điểm đặt hàng"
        data_tests:
          - not_null
      - name: total_items
        description: "Tổng số món hàng trong đơn"
        data_tests:
          - not_null
          - non_negative
      - name: total_item_value
        description: "Tổng tiền hàng thuần của đơn"
        data_tests:
          - not_null
          - non_negative
      - name: total_freight_value
        description: "Tổng phí vận chuyển của đơn"
        data_tests:
          - not_null
          - non_negative
      - name: total_order_cost
        description: "Tổng giá trị hàng hóa cộng phí vận chuyển của đơn hàng"
        data_tests:
          - not_null
          - non_negative
      - name: total_payment_value
        description: "Tổng số tiền thanh toán thực tế của đơn hàng"
        data_tests:
          - not_null
          - non_negative
      - name: is_delayed
        description: "Cờ đánh dấu đơn hàng có bị giao trễ hạn dự kiến hay không (1 = Trễ, 0 = Đúng hạn, NULL = Chưa giao)"
      - name: delivery_status
        description: "Trạng thái giao hàng chuẩn hóa phục vụ phân tích BI"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Pending Delivery', 'Delayed', 'On Time']

  - name: dim_customers
    description: "Bảng Dimension lưu trữ thông tin khách hàng, phân khúc và tổng chi tiêu trọn đời (LTV)"
    columns:
      - name: customer_id
        description: "Khóa chính của khách hàng cho mỗi đơn"
        data_tests:
          - unique
          - not_null
      - name: customer_unique_id
        description: "Định danh duy nhất của mỗi người dùng thật"
        data_tests:
          - not_null
      - name: total_orders
        description: "Tổng số đơn hàng trọn đời của khách hàng"
        data_tests:
          - not_null
          - non_negative
      - name: lifetime_spend
        description: "Tổng giá trị thanh toán trọn đời (LTV)"
        data_tests:
          - not_null
          - non_negative
      - name: customer_segment
        description: "Phân khúc khách hàng mua một lần hay quay lại"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['One-Time Customer', 'Returning Customer']

  - name: dim_products
    description: "Bảng Dimension lưu trữ danh mục sản phẩm đã được dịch sang tiếng Anh kèm kích thước, trọng lượng"
    columns:
      - name: product_id
        description: "Khóa chính của sản phẩm"
        data_tests:
          - unique
          - not_null
      - name: category_name
        description: "Tên danh mục sản phẩm chuẩn hóa bằng tiếng Anh"
        data_tests:
          - not_null
      - name: product_weight_g
        description: "Trọng lượng sản phẩm (gram)"
        data_tests:
          - non_negative
