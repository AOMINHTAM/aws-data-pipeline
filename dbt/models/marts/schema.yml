version: 2

models:
  - name: fct_orders
    description: "Bảng Fact cấp đơn hàng (1 dòng = 1 order_id) kèm doanh thu, thanh toán, SLA vận chuyển và điểm đánh giá"
    columns:
      - name: order_id
        description: "Khóa chính (Primary Key) của đơn hàng"
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: "Mã khách theo đơn từ hệ thống nguồn Olist (degenerate source key)"
        data_tests:
          - not_null
      - name: customer_unique_id
        description: "Khóa ngoại (N:1) liên kết tới khách hàng thật trong bảng dim_customers"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_unique_id
      - name: order_status
        description: "Trạng thái hiện tại của đơn hàng"
        data_tests:
          - not_null
      - name: order_purchase_timestamp
        description: "Thời điểm đặt hàng"
        data_tests:
          - not_null
      - name: total_items
        description: "Tổng số món hàng trong đơn"
        data_tests:
          - not_null
          - non_negative
      - name: total_item_value
        description: "Tổng tiền hàng thuần của đơn"
        data_tests:
          - not_null
          - non_negative
      - name: total_freight_value
        description: "Tổng phí vận chuyển của đơn"
        data_tests:
          - not_null
          - non_negative
      - name: total_order_cost
        description: "Tổng giá trị hàng hóa cộng phí vận chuyển của đơn hàng"
        data_tests:
          - not_null
          - non_negative
      - name: total_payment_value
        description: "Tổng số tiền thanh toán thực tế của đơn hàng"
        data_tests:
          - not_null
          - non_negative
      - name: is_delayed
        description: "Cờ đánh dấu đơn hàng có bị giao trễ hạn dự kiến hay không (1 = Trễ, 0 = Đúng hạn, NULL = Chưa giao)"
      - name: delivery_status
        description: "Trạng thái giao hàng chuẩn hóa phục vụ phân tích BI"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Pending Delivery', 'Delayed', 'On Time']

  - name: fct_order_items
    description: "Bảng Fact cấp chi tiết món hàng (1 dòng = 1 order_id + order_item_id) nối trực tiếp dim_products, fct_orders và dim_customers"
    data_tests:
      - composite_unique:
          arguments:
            combination_of_columns:
              - order_id
              - order_item_id
    columns:
      - name: order_item_key
        description: "Khóa đại diện duy nhất (order_id-order_item_id) cho chiến lược incremental delete+insert"
        data_tests:
          - unique
          - not_null
      - name: order_id
        description: "Khóa ngoại (N:1) liên kết tới bảng fct_orders"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: order_item_id
        description: "Số thứ tự món hàng trong đơn"
        data_tests:
          - not_null
      - name: customer_unique_id
        description: "Khóa ngoại (N:1) liên kết tới bảng dim_customers"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_unique_id
      - name: product_id
        description: "Khóa ngoại (N:1) liên kết tới bảng dim_products"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: seller_id
        description: "Mã người bán"
        data_tests:
          - not_null
      - name: order_status
        description: "Trạng thái hiện tại của đơn hàng"
        data_tests:
          - not_null
      - name: order_purchase_timestamp
        description: "Thời điểm đặt hàng"
        data_tests:
          - not_null
      - name: price
        description: "Giá bán món hàng (chưa gồm phí vận chuyển)"
        data_tests:
          - not_null
          - non_negative
      - name: freight_value
        description: "Phí vận chuyển phân bổ cho món hàng"
        data_tests:
          - not_null
          - non_negative
      - name: total_item_value
        description: "Tổng giá trị món hàng (price + freight_value)"
        data_tests:
          - not_null
          - non_negative

  - name: dim_customers
    description: "Bảng Dimension khách hàng thật (1 dòng = 1 customer_unique_id, loại bỏ hoàn toàn bẫy nhân đôi LTV)"
    columns:
      - name: customer_unique_id
        description: "Khóa chính — định danh duy nhất của mỗi khách hàng thật"
        data_tests:
          - unique
          - not_null
      - name: state
        description: "Bang của khách hàng ở đơn hàng gần nhất"
        data_tests:
          - not_null
      - name: total_orders
        description: "Tổng số đơn hàng trọn đời của khách hàng"
        data_tests:
          - not_null
          - non_negative
      - name: lifetime_spend
        description: "Tổng giá trị thanh toán trọn đời (LTV)"
        data_tests:
          - not_null
          - non_negative
      - name: customer_segment
        description: "Phân khúc khách hàng mua một lần hay quay lại"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['One-Time Customer', 'Returning Customer']

  - name: dim_products
    description: "Bảng Dimension lưu trữ danh mục sản phẩm đã được dịch sang tiếng Anh kèm kích thước, trọng lượng"
    columns:
      - name: product_id
        description: "Khóa chính của sản phẩm"
        data_tests:
          - unique
          - not_null
      - name: category_name
        description: "Tên danh mục sản phẩm chuẩn hóa bằng tiếng Anh"
        data_tests:
          - not_null
      - name: product_weight_g
        description: "Trọng lượng sản phẩm (gram)"
        data_tests:
          - non_negative
